# ============================================================================
# TradeBuddy - docker compose
#
# TWO DATA MODES:
#
#   1. AGENT MODE (default, recommended) - `docker compose up -d`
#      Only the `app` service runs. Install a push agent next to each MT4/MT5
#      terminal (see agents/README.md); agents POST snapshots to /api/ingest.
#      No Wine, no MetaQuotes installers, nothing else to break.
#
#   2. PULL MODE (server-side collection) - `docker compose --profile pull up -d`
#      Adds the Python collector + optional Wine MT4/MT5 gateway containers.
#      The collector polls every account and needs a reachable gateway per
#      platform. The Wine gateways are EXPERIMENTAL: the MetaQuotes terminal
#      installers are not reliably scriptable under Wine (MT5's web installer
#      can abort with 0x50000018; MT4 first boot can take >10 minutes in
#      "health: starting" while Wine initializes). Prefer agent mode.
#
# SECURITY - READ BEFORE EXPOSING ANYTHING:
#   * NEVER expose /api/collect/accounts publicly. It returns account logins
#     with DECRYPTED investor passwords (behind X-Ingest-Token, which must stay
#     a server-side secret). Put the whole UI behind a reverse proxy with
#     authentication (basic auth, SSO, Tailscale/WireGuard VPN, ...).
#   * Use strong, unique ENCRYPTION_KEY and INGEST_TOKEN values (see .env.example).
#   * The ingest token is what agents/collector authenticate with - keep it
#     secret. Set EXPOSE_INGEST_TOKEN=1 only on private instances so the
#     dashboard can show copy-paste ready agent inputs.
#   * Investor (read-only) passwords are mandatory for accounts you add via
#     pull mode; agents only ever need the investor password locally.
# ============================================================================

services:
  # ------------------------------------------------------------------ app ---
  app:
    build: .
    image: mt-monitor-app
    environment:
      DATABASE_URL: file:/data/monitor.db
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env (see .env.example)}
      INGEST_TOKEN: ${INGEST_TOKEN:?Set INGEST_TOKEN in .env (see .env.example)}
      POLL_MINUTES: ${POLL_MINUTES:-5}
      # Agent mode helpers:
      #   PUBLIC_APP_URL: absolute base URL agents should use (optional -
      #   /api/agent/config otherwise derives it from proxy headers).
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      #   EXPOSE_INGEST_TOKEN=1 lets the dashboard show the token in the
      #   agent setup guide. Keep 0 when strangers can reach the UI.
      EXPOSE_INGEST_TOKEN: ${EXPOSE_INGEST_TOKEN:-0}
      # Pull mode only: deploy.sh --pull adds COLLECTOR_URL to .env for you.
      # Leave it UNSET in agent mode - a value here makes the dashboard hide
      # the agent setup guide and show "collector unreachable" instead.
      COLLECTOR_URL: ${COLLECTOR_URL:-}
    ports:
      - "3000:3000"
    volumes:
      - appdata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 10s

  # ------------------------------------------------------------ collector ---
  # PULL MODE ONLY: enable with `docker compose --profile pull up -d`
  collector:
    profiles: ["pull"]
    build: ./collector
    image: mt-monitor-collector
    environment:
      APP_URL: http://app:3000
      INGEST_TOKEN: ${INGEST_TOKEN:?Set INGEST_TOKEN in .env (see .env.example)}
      POLL_MINUTES: ${POLL_MINUTES:-5}
      MT4_GATEWAY_URL: ${MT4_GATEWAY_URL:-http://mt4-gateway:8001}
      MT5_GATEWAY_URL: ${MT5_GATEWAY_URL:-http://mt5-gateway:8002}
      COLLECTION_JITTER_SECONDS: ${COLLECTION_JITTER_SECONDS:-20}
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u,sys; sys.exit(0 if u.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  # --------------------------------------------------------- mt4-gateway ---
  # PULL MODE ONLY (experimental). Wine + MT4 terminal + ZeroMQ bridge EA +
  # Node app. One container serves ONE MT4 account (terminal limitation).
  # First boot downloads MT4, compiles the EA and can sit in "health:
  # starting" for 10+ minutes while Wine initializes - that is normal once.
  mt4-gateway:
    profiles: ["pull"]
    build: ./gateways/mt4-gateway
    image: mt-monitor-mt4-gateway
    environment:
      BRIDGE_API_KEY: ${MT4_BRIDGE_API_KEY:-change-me}
      GATEWAY_LOGIN: ${MT4_GATEWAY_LOGIN:-}
      MT4_LOGIN: ${MT4_LOGIN:-}
      MT4_PASSWORD: ${MT4_PASSWORD:-}
      MT4_SERVER: ${MT4_SERVER:-}
      MT4_HISTORY_CMD: ${MT4_HISTORY_CMD:-}
    volumes:
      - mt4data:/opt/mt4
    shm_size: 1gb
    depends_on:
      app:
        condition: service_healthy
    # /health always answers 200 once the Node server is up (bridge state is
    # reported in the payload, not the status code) - so this check means
    # "gateway process reachable", not "terminal logged in".
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/health"]
      interval: 30s
      timeout: 5s
      # first boot downloads MT4 + compiles the bridge EA inside the volume
      start_period: 12m
      retries: 5
    restart: unless-stopped
    stop_grace_period: 30s

  # --------------------------------------------------------- mt5-gateway ---
  # PULL MODE ONLY (experimental). Wine + official MT5 terminal + Windows
  # Python FastAPI bridge. Connects accounts SEQUENTIALLY (one terminal).
  mt5-gateway:
    profiles: ["pull"]
    build: ./gateways/mt5-gateway
    image: mt-monitor-mt5-gateway
    environment:
      MT5_PRESTART: ${MT5_PRESTART:-true}
      MT5_TERMINAL_PATH: "C:\\Program Files\\MetaTrader 5\\terminal64.exe"
    volumes:
      - mt5data:/opt/mt5
    shm_size: 1gb
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8002/health"]
      interval: 30s
      timeout: 5s
      # fresh mt5data volume: wine prefix init + terminal warm-up on first boot
      start_period: 10m
      retries: 5
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  appdata:    # SQLite database (monitor.db) - BACK THIS UP
  mt4data:    # wine prefix + MT4 terminal + bridge EA + login state
  mt5data:    # wine prefix + MT5 terminal; drop broker .srv files at /opt/mt5/srv
